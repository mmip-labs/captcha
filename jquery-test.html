<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div id="result"></div>
<script>
const resultDiv = document.getElementById('result');


function makeRequest(num) {
    $.ajax({
        url: 'https://t.mmip.ru/captcha/api.php',
        type: 'GET',
        success: function(response) {
            console.log('Ответ:', response);
            resultDiv.innerHTML += `
                <p>Запрос ${num}, Ответ: ${response}</p>
            `;
//            if (num < 10) {
//                    console.log('Wait 3 sec');
//                    setTimeout(() => makeRequest(num + 1), 1000);
//            }
        },
        error: function(error) {
            console.log('Ошибка:', error);
        }
    });
}

$.when(
  makeRequest(1),
  makeRequest(1),
  makeRequest(1),
  makeRequest(1),
  makeRequest(1),
  makeRequest(1),
  makeRequest(1),
  makeRequest(1)
).done(function (r1, r2, r3, r4, r5) {
  console.log('Все функции завершились');
}).fail(function () {
  console.error('Одна из функций упала');
});


</script>
</body>
</html>
